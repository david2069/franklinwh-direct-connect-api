name: Release

# Builds and validates the sdist + wheel on every push/PR (packaging never breaks silently).
# Publishing to PyPI is GATED on a version tag and uses trusted publishing (OIDC) — it is
# effectively held while the repository is private / until a `v*` tag is pushed.

on:
  push:
    tags: ["v*"]          # build+publish on version tags only (not every main push)
  pull_request:           # PRs still validate packaging
  workflow_dispatch:

jobs:
  build:
    name: Build & validate distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Build sdist + wheel
        run: python -m build

      - name: Validate metadata (twine check)
        run: twine check dist/*

      - name: Show artifacts
        run: ls -l dist/

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    name: Publish to PyPI (tags only)
    needs: build
    # Only runs on a version tag. Held while the repo is private — do not tag to publish
    # until PyPI trusted publishing is configured for this project.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write            # OIDC trusted publishing — no API token needed
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
