name: Deploy Docs

on:
  # Re-enabled 2026-10-07: the budget freeze that muted this expired 2026-10-01,
  # and the site had silently gone four commits stale (still titled "FranklinWH
  # Local" after the rename). Path-filtered so unrelated pushes cost nothing.
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'franklinwh_local/**'      # API.md is generated from the source by mkdocstrings
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: |
          pip install -e .
          pip install mkdocs-material "mkdocstrings[python]"

      - name: Build docs
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: build
    # Pages is enabled and the repo is public, so a docs change on main
    # publishes. A manual run still works for a forced re-deploy.
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
