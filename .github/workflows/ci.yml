name: CI

on:
  # push trigger muted 2026-09-20 while the Actions budget is $0 (resets 2026-10-01).
  # Restore `push: {branches: [main]}` after the reset to re-enable push CI.
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Full matrix only on PRs / manual runs; a push to main runs one version
        # to keep routine pushes cheap on the free tier.
        python-version: ${{ (github.event_name == 'push' && fromJSON('["3.12"]')) || fromJSON('["3.10","3.11","3.12"]') }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run tests
        run: pytest -v -m "not live"

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: CLI smoke (offline)
        run: |
          franklinwh-direct-connect --version
          franklinwh-direct-connect catalog
          franklinwh-direct-connect decode tests/fixtures/smoke.pcap --json > /dev/null
          # the deprecated alias must keep working for the whole 0.4.x line
          franklinwh-local --version
      - name: Emulator + client + scan round-trip
        run: |
          python - <<'PY'
          from franklinwh_direct_connect_api.emulator import Emulator
          from franklinwh_direct_connect_api.client import DirectConnectClient
          from franklinwh_direct_connect_api import discover
          # Port 0 = an ephemeral port chosen by the OS. Never 9000: that is reserved
          # for a real aGate and the FranklinWH Gateway Emulator, and Emulator() refuses
          # it. Ephemeral also means two CI jobs cannot collide on a fixed port.
          emu = Emulator("127.0.0.1", 0).start()
          try:
              with DirectConnectClient("127.0.0.1", emu.port, timeout=3.0) as c:
                  assert c.login()["IBG_SN"]
                  assert "soc" in c.power_flow()
              # discover.scan can only probe 9000/502 -- `ports` is a filter over those
              # two constants, not a list of ports to scan (DEF-SCAN-IGNORES-CUSTOM-PORTS).
              # So it CANNOT confirm an emulator on an ephemeral port, and asserting a
              # confirmed gateway here would require a listener on 9000, which is now
              # refused. Exercise the code path and assert the honest outcome instead:
              # nothing is on 9000, so nothing is confirmed.
              res = discover.scan(["127.0.0.1"], timeout=1.0)
              assert not any(r.sendmqtt_confirmed for r in res), (
                  "something answered a login on 127.0.0.1:9000 -- a mock must never "
                  f"listen there: {[r.summary() for r in res]}")
              print("smoke OK: login + power_flow on", emu.port,
                    "| scan found no gateway on :9000, as expected")
          finally:
              emu.stop()
          PY
