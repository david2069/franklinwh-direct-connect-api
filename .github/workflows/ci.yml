name: CI

on:
  # push trigger muted 2026-09-20 while the Actions budget is $0 (resets 2026-10-01).
  # Restore `push: {branches: [main]}` after the reset to re-enable push CI.
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Full matrix only on PRs / manual runs; a push to main runs one version
        # to keep routine pushes cheap on the free tier.
        python-version: ${{ (github.event_name == 'push' && fromJSON('["3.12"]')) || fromJSON('["3.10","3.11","3.12"]') }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run tests
        run: pytest -v -m "not live"

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: CLI smoke (offline)
        run: |
          franklinwh-direct-connect --version
          franklinwh-direct-connect catalog
          franklinwh-direct-connect decode tests/fixtures/smoke.pcap --json > /dev/null
          # the deprecated alias must keep working for the whole 0.4.x line
          franklinwh-local --version
      - name: Emulator + client + scan round-trip
        run: |
          python - <<'PY'
          from franklinwh_direct_connect_api.emulator import Emulator
          from franklinwh_direct_connect_api.client import DirectConnectClient
          from franklinwh_direct_connect_api import discover
          emu = Emulator("127.0.0.1", 9000).start()
          try:
              with DirectConnectClient("127.0.0.1", 9000, timeout=3.0) as c:
                  assert c.login()["IBG_SN"]
                  assert "soc" in c.power_flow()
              res = discover.scan(["127.0.0.1"], timeout=1.0)
              assert res and res[0].sendmqtt_confirmed
              print("smoke OK:", res[0].summary())
          finally:
              emu.stop()
          PY
