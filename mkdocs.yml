site_name: FranklinWH Local
site_description: Unofficial Python library & CLI for the FranklinWH aGate local broker protocol (TCP/9000)
site_url: https://david2069.github.io/franklinwh-direct-connect-api
repo_url: https://github.com/david2069/franklinwh-direct-connect-api
repo_name: david2069/franklinwh-direct-connect-api

theme:
  name: material
  palette:
    - scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            show_source: false
            show_root_heading: true
            show_if_no_docstring: false
            heading_level: 3
            docstring_style: google
            members_order: source
            separate_signature: true
            show_signature_annotations: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Usage Guide: USAGE.md
  - Protocol & Catalog: PROTOCOL.md
  - Cloud API Mapping: CLOUD_MAPPING.md
  - API Reference: API.md
  - Compare the two Local API libs: LOCAL_API_COMPARISON.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/david2069/franklinwh-direct-connect-api
