# Metadata-only "pointer" release for the retired `franklinwh-local` distribution.
#
# It ships NO modules on purpose. franklinwh-direct-connect-api >= 0.4.0 already
# provides the `franklinwh_local` compatibility shim, and two distributions both
# owning that import package would conflict on install. So this package's only
# job is to depend on the new one and say, on its PyPI page, where things moved.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "franklinwh-local"
version = "0.1.0"
description = "RENAMED — install franklinwh-direct-connect-api instead. This is a pointer package."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "david2069", email = "david.hona@gmail.com"}]
keywords = ["franklinwh", "deprecated", "renamed"]
classifiers = [
  "Development Status :: 7 - Inactive",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
dependencies = ["franklinwh-direct-connect-api>=0.4.0"]

[project.urls]
Homepage = "https://github.com/david2069/franklinwh-direct-connect-api"
Documentation = "https://david2069.github.io/franklinwh-direct-connect-api/"
Issues = "https://github.com/david2069/franklinwh-direct-connect-api/issues"

[tool.setuptools]
packages = []
